spring.application.name=library
 
# In-memory H2 database: created fresh on every start, filled from data.sql
spring.datasource.url=jdbc:h2:mem:movies
spring.datasource.username=sa
spring.datasource.password=
 
# H2 console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:movies, user sa, blank password)
spring.h2.console.enabled=true
 
# Print the SQL behind each repository method
spring.jpa.show-sql=true
 
# Run data.sql after Hibernate has created the movie table
spring.jpa.defer-datasource-initialization=true
 
# Re-read templates on every request while developing
spring.thymeleaf.cache=false