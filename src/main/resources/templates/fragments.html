<head th:fragment="head(title)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${title} + ' &bull; yo mamas movies'">Library</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<header th:fragment="header(title, previous_page)">
  <h1 th:text="${title} + ' &bull; yo mamas movies'"></h1>
  <nav>
    <a th:unless="${#strings.isEmpty(previous_page)}" th:href="@{previous_page}"
      >Back</a
    >

    <a th:href="@{/movies/new}">Add a movie</a>
  </nav>
</header>
